name: Deploy QA build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 얼굴 모델을 같은 도메인에 포함 (실패하면 앱이 구글 공식 경로로 대체)
      - run: npm run fetch-model || echo "model fetch failed; app will use remote model"
      - run: npx vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_QA: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
